name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l cmd)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Install shellcheck
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh tmux-ai-attn.tmux

  build-release:
    if: |
      always() &&
      needs.test.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || needs.tag_version.outputs.created == 'true')
    needs: [test, tag_version]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-s -w" \
            -o "tmux-ai-attn-sync-${GOOS}-${GOARCH}" \
            ./cmd/tmux-ai-attn-sync

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmux-ai-attn-sync-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tmux-ai-attn-sync-${{ matrix.goos }}-${{ matrix.goarch }}

  tag_version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.version.outputs.created }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag from VERSION when bumped
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          before="${{ github.event.before }}"
          if [[ "$before" =~ ^0+$ ]]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git diff --name-only "$before" "$GITHUB_SHA" -- VERSION | grep -qx VERSION; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$version" =~ ^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION must contain a v-prefixed semantic version, got '$version'"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "::error::VERSION changed to $version, but tag $version already exists"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "Release $version" "$GITHUB_SHA"
          git push origin "refs/tags/$version"
          echo "created=true" >> "$GITHUB_OUTPUT"

  release:
    if: |
      always() &&
      needs['build-release'].result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || needs.tag_version.outputs.created == 'true')
    needs: [build-release, tag_version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -name 'tmux-ai-attn-sync-*' -exec cp {} ../ \;
          cd ..
          sha256sum tmux-ai-attn-sync-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag_version.outputs.version || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            tmux-ai-attn-sync-*
            checksums.txt
