# tmux-ai-attn: generated by tmux.rb from tmux-ai-attn.rb. Do not edit; change
# lib/tmux-ai-attn.rb and run `make conf` instead.
#
# tmux-ai-attn.tmux loads this file after setting TMUX_AI_ATTN_DIR to the
# plugin checkout.
if-shell -F "#{==:#{@ai_attn_cli},}" {
  set-option -g @ai_attn_cli "ai-attn"
}
if-shell -F "#{==:#{@ai_attn_dev_build},}" {
  set-option -g @ai_attn_dev_build "off"
}
if-shell -F "#{==:#{@ai_attn_seen_flash_seconds},}" {
  set-option -g @ai_attn_seen_flash_seconds "3"
}
if-shell -F "#{==:#{@ai_attn_enable_default_formats},}" {
  set-option -g @ai_attn_enable_default_formats "off"
}
if-shell -F "#{==:#{@ai_attn_refresh_client},}" {
  set-option -g @ai_attn_refresh_client "on"
}
if-shell -F "#{==:#{@ai_attn_icon_waiting},}" {
  set-option -g @ai_attn_icon_waiting "⚠"
}
if-shell -F "#{==:#{@ai_attn_icon_stopped},}" {
  set-option -g @ai_attn_icon_stopped "⏸"
}
if-shell -F "#{==:#{@ai_attn_icon_done},}" {
  set-option -g @ai_attn_icon_done "✓"
}
if-shell -F "#{==:#{@ai_attn_color_waiting},}" {
  set-option -g @ai_attn_color_waiting "yellow"
}
if-shell -F "#{==:#{@ai_attn_color_stopped},}" {
  set-option -g @ai_attn_color_stopped "colour196"
}
if-shell -F "#{==:#{@ai_attn_color_working},}" {
  set-option -g @ai_attn_color_working "#d88786"
}
if-shell -F "#{==:#{@ai_attn_color_done},}" {
  set-option -g @ai_attn_color_done "green"
}
if-shell -F "#{==:#{@ai_attn_color_flash_bg},}" {
  set-option -g @ai_attn_color_flash_bg "colour226"
}
if-shell -F "#{==:#{@ai_attn_color_flash_fg},}" {
  set-option -g @ai_attn_color_flash_fg "colour16"
}
if-shell -F "#{==:#{@ai_attn_color_text_fg},}" {
  set-option -g @ai_attn_color_text_fg "colour255"
}
if-shell -F "#{==:#{@ai_attn_spinner_frames},}" {
  set-option -g @ai_attn_spinner_frames "·,·,✢,✳,✶,✽,✻,✻,✻,✽,✶,✳,✢,·"
}
if-shell -F "#{==:#{@ai_attn_tick_ms},}" {
  set-option -g @ai_attn_tick_ms "120"
}
if-shell -F "#{==:#{@ai_attn_flash_multiplier},}" {
  set-option -g @ai_attn_flash_multiplier "4"
}
run-shell -b "\"${TMUX_AI_ATTN_DIR}/scripts/start-loop.sh\" \"${TMUX_AI_ATTN_DIR}\" --restart || true"
set-hook -g "client-attached[50]" "run-shell -b \"log=\\\"\\\${TMUX_AI_ATTN_LOG:-\\\${XDG_STATE_HOME:-\\\$HOME/.local/state}/tmux-ai-attn/hooks.log}\\\"; mkdir -p \\\"\\\${log%/*}\\\" 2>/dev/null; if [ -x \\\"\${TMUX_AI_ATTN_DIR}/scripts/start-loop.sh\\\" ]; then \\\"\${TMUX_AI_ATTN_DIR}/scripts/start-loop.sh\\\" \\\"\${TMUX_AI_ATTN_DIR}\\\" >> \\\"\\\$log\\\" 2>&1 || { printf \\\"%s [hook] start-loop.sh failed\\\\n\\\" \\\"\\\$(date +%Y-%m-%dT%H:%M:%S)\\\" >> \\\"\\\$log\\\" 2>/dev/null; tmux display-message \\\"[tmux-ai-attn] hook failed (see \\\$log)\\\"; }; else printf \\\"%s [hook] plugin missing: %s\\\\n\\\" \\\"\\\$(date +%Y-%m-%dT%H:%M:%S)\\\" \\\"\${TMUX_AI_ATTN_DIR}/scripts/start-loop.sh\\\" >> \\\"\\\$log\\\" 2>/dev/null; tmux display-message \\\"[tmux-ai-attn] plugin missing (see \\\$log)\\\"; fi\""
set-hook -g "client-session-changed[50]" "run-shell -b \"log=\\\"\\\${TMUX_AI_ATTN_LOG:-\\\${XDG_STATE_HOME:-\\\$HOME/.local/state}/tmux-ai-attn/hooks.log}\\\"; mkdir -p \\\"\\\${log%/*}\\\" 2>/dev/null; if [ -x \\\"\${TMUX_AI_ATTN_DIR}/scripts/start-loop.sh\\\" ]; then \\\"\${TMUX_AI_ATTN_DIR}/scripts/start-loop.sh\\\" \\\"\${TMUX_AI_ATTN_DIR}\\\" >> \\\"\\\$log\\\" 2>&1 || { printf \\\"%s [hook] start-loop.sh failed\\\\n\\\" \\\"\\\$(date +%Y-%m-%dT%H:%M:%S)\\\" >> \\\"\\\$log\\\" 2>/dev/null; tmux display-message \\\"[tmux-ai-attn] hook failed (see \\\$log)\\\"; }; else printf \\\"%s [hook] plugin missing: %s\\\\n\\\" \\\"\\\$(date +%Y-%m-%dT%H:%M:%S)\\\" \\\"\${TMUX_AI_ATTN_DIR}/scripts/start-loop.sh\\\" >> \\\"\\\$log\\\" 2>/dev/null; tmux display-message \\\"[tmux-ai-attn] plugin missing (see \\\$log)\\\"; fi\""
set-hook -g "session-created[50]" "run-shell -b \"log=\\\"\\\${TMUX_AI_ATTN_LOG:-\\\${XDG_STATE_HOME:-\\\$HOME/.local/state}/tmux-ai-attn/hooks.log}\\\"; mkdir -p \\\"\\\${log%/*}\\\" 2>/dev/null; if [ -x \\\"\${TMUX_AI_ATTN_DIR}/scripts/start-loop.sh\\\" ]; then \\\"\${TMUX_AI_ATTN_DIR}/scripts/start-loop.sh\\\" \\\"\${TMUX_AI_ATTN_DIR}\\\" >> \\\"\\\$log\\\" 2>&1 || { printf \\\"%s [hook] start-loop.sh failed\\\\n\\\" \\\"\\\$(date +%Y-%m-%dT%H:%M:%S)\\\" >> \\\"\\\$log\\\" 2>/dev/null; tmux display-message \\\"[tmux-ai-attn] hook failed (see \\\$log)\\\"; }; else printf \\\"%s [hook] plugin missing: %s\\\\n\\\" \\\"\\\$(date +%Y-%m-%dT%H:%M:%S)\\\" \\\"\${TMUX_AI_ATTN_DIR}/scripts/start-loop.sh\\\" >> \\\"\\\$log\\\" 2>/dev/null; tmux display-message \\\"[tmux-ai-attn] plugin missing (see \\\$log)\\\"; fi\""
set-hook -g "after-new-session[50]" "run-shell -b \"log=\\\"\\\${TMUX_AI_ATTN_LOG:-\\\${XDG_STATE_HOME:-\\\$HOME/.local/state}/tmux-ai-attn/hooks.log}\\\"; mkdir -p \\\"\\\${log%/*}\\\" 2>/dev/null; if [ -x \\\"\${TMUX_AI_ATTN_DIR}/scripts/start-loop.sh\\\" ]; then \\\"\${TMUX_AI_ATTN_DIR}/scripts/start-loop.sh\\\" \\\"\${TMUX_AI_ATTN_DIR}\\\" >> \\\"\\\$log\\\" 2>&1 || { printf \\\"%s [hook] start-loop.sh failed\\\\n\\\" \\\"\\\$(date +%Y-%m-%dT%H:%M:%S)\\\" >> \\\"\\\$log\\\" 2>/dev/null; tmux display-message \\\"[tmux-ai-attn] hook failed (see \\\$log)\\\"; }; else printf \\\"%s [hook] plugin missing: %s\\\\n\\\" \\\"\\\$(date +%Y-%m-%dT%H:%M:%S)\\\" \\\"\${TMUX_AI_ATTN_DIR}/scripts/start-loop.sh\\\" >> \\\"\\\$log\\\" 2>/dev/null; tmux display-message \\\"[tmux-ai-attn] plugin missing (see \\\$log)\\\"; fi\""
if-shell -F "#{==:#{@ai_attn_enable_default_formats},on}" {
  set-option -g status-interval 1
  set-option -gw window-status-format "#{?@ai_attn_window_waiting,#{?@ai_attn_window_flash,#{?@ai_attn_flash_phase,#[fg=colour231#,bg=colour160#,bold],#[fg=colour231#,bg=colour52#,bold]},#[fg=colour231#,bg=colour52]},#[fg=colour244]} #{window_index}:#{window_name} #[default]"
  set-option -gw window-status-current-format "#{?@ai_attn_window_waiting,#{?@ai_attn_window_flash,#{?@ai_attn_flash_phase,#[fg=colour16#,bg=colour226#,bold],#[fg=colour16#,bg=colour208#,bold]},#[fg=colour16#,bg=colour208]},#[fg=colour255#,bg=colour24#,bold]} #{window_index}:#{window_name} #[default]"
}
